<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đảo Đèn Lồng — 3D Third-Person Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #060913; font-family: 'Segoe UI', system-ui, sans-serif; }
    #game-canvas { width: 100%; height: 100%; display: block; }
    
    /* HUD overlay */
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 215, 0, 0.25);
      border-radius: 12px;
      padding: 10px 18px;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .hud-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
    .hud-value { font-size: 20px; font-weight: bold; color: #fbbf24; }
    #hud-flames { font-size: 22px; letter-spacing: 4px; }

    /* Controls guide */
    #controls-guide {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 12px 16px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.6;
      pointer-events: none;
    }
    .key-badge {
      display: inline-block;
      background: #334155;
      color: #f8fafc;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
      border: 1px solid #475569;
    }

    /* Modal dialog */
    #modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 16, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }
    #modal-overlay.hidden { display: none; }
    .modal-box {
      background: #111827;
      border: 2px solid #fbbf24;
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      max-width: 440px;
      box-shadow: 0 0 40px rgba(251, 191, 36, 0.2);
    }
    #modal-title { font-size: 26px; font-weight: 800; margin-bottom: 12px; }
    #modal-desc { font-size: 15px; color: #94a3b8; white-space: pre-line; line-height: 1.6; margin-bottom: 24px; }
    .btn-action {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div style="display: flex; gap: 12px;">
      <div class="hud-card">
        <div>
          <div class="hud-label">Sinh mệnh</div>
          <div id="hud-flames">🔥🔥🔥</div>
        </div>
      </div>
      <div class="hud-card">
        <div>
          <div class="hud-label">Đom đóm mang theo</div>
          <div class="hud-value" id="hud-motes">0 / 5</div>
        </div>
      </div>
      <div class="hud-card">
        <div>
          <div class="hud-label">Đèn lồng thắp sáng</div>
          <div class="hud-value" id="hud-lanterns">0 / 5</div>
        </div>
      </div>
    </div>

    <div style="display: flex; gap: 12px;">
      <div class="hud-card">
        <div>
          <div class="hud-label">Thời gian còn lại</div>
          <div class="hud-value" id="hud-timer">05:00</div>
        </div>
      </div>
      <div class="hud-card">
        <div>
          <div class="hud-label">Điểm số</div>
          <div class="hud-value" id="hud-score">0</div>
        </div>
      </div>
    </div>
  </div>

  <div id="controls-guide">
    <div><span class="key-badge">W A S D</span> / <span class="key-badge">↑ ← ↓ →</span> : Di chuyển Mây</div>
    <div><span class="key-badge">E</span> : Thắp sáng Đèn Lồng (Interact)</div>
    <div><span class="key-badge">Q</span> / <span class="key-badge">Space</span> : Tỏa sáng xua đuổi Bóng Mực (Pulse)</div>
    <div><span class="key-badge">Chuột kéo</span> : Xoay góc nhìn camera</div>
  </div>

  <div id="modal-overlay" class="hidden">
    <div class="modal-box">
      <h2 id="modal-title">KẾT THÚC</h2>
      <p id="modal-desc">Mô tả kết quả ván chơi</p>
      <button id="restart-btn" class="btn-action">Chơi Lại</button>
    </div>
  </div>

  <script type="module" src="./src/render/main.js"></script>
</body>
</html>
